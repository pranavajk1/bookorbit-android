name: CI

# Checks every PR: lint, unit tests, and a debug build of both flavors, so a PR can't merge with a
# build error. Nothing is kept from these builds; release builds happen only in release.yml.
#
# Two flavors: "full" (default, keeps Chromecast support) and "fdroid" (excludes Google's
# proprietary Cast/Play-Services libraries entirely, for the official F-Droid submission) -- see
# the flavor comment in app/build.gradle.kts. Each step covers both so a regression in either
# flavor's own sources (app/src/{full,fdroid}/) fails CI.

on:
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the run still going for its previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    # A clean run takes about ten minutes. Without a cap a stalled Gradle sits for GitHub's six-hour
    # default; this fails it after half an hour instead.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google removed the legacy standalone "tools" package (this action's default) from the
          # SDK repository; sdkmanager now fails to find it. platform-tools is all this job needs -
          # the Android Gradle Plugin fetches whatever platform/build-tools versions it requires on
          # its own, once licenses are accepted.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Pre-create the debug keystore
        # AGP lazily auto-generates ~/.android/debug.keystore on first use. With
        # org.gradle.parallel=true, assembling both flavors' debug builds can trigger that
        # generation from two packaging tasks at once on a fresh runner (no keystore yet),
        # corrupting it and failing packageFullDebug/packageFdroidDebug non-deterministically.
        # Creating it up front, before any Gradle task runs, removes the race.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias AndroidDebugKey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10950 \
            -keyalg RSA -keysize 2048

      - name: Lint
        run: ./gradlew :app:lintFullDebug :app:lintFdroidDebug

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleFdroidDebug
